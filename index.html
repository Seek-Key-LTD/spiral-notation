<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>螺线谱 · 对数等角螺线乐律可视化 (Spiral Notation)</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./src/vendor/acoustic_grand_piano.js" defer></script>
</head>
<body>

  <!-- 顶部星盘指示栏 -->
  <header>
    <div class="brand">
      <h1>螺 线 谱</h1>
      <div class="sub">SPIRAL NOTATION · 对数等角螺线 (r = r₀ · 2^(θ/2π)) · 十二地支 · 三合局转调</div>
    </div>
    <nav class="header-nav">
      <a href="/" class="nav-hud-link" title="返回工作台首页">🏛️ ASN 首页</a>
      <a href="/cast" class="nav-hud-link" title="人物总档案 30对">👥 人物总档案</a>
      <a href="/whiteboard" class="nav-hud-link" title="通识白板 牙仙清算">📐 通识白板</a>
      <a href="/handscroll/kunlun-tianwen" class="nav-hud-link" title="昆仑天问 巨幅数字长卷">📜 昆仑天问长卷</a>
    </nav>
    <div class="meta-info">
      <div class="hud-item">
        <span class="hud-label">共鸣三合局</span>
        <span id="active-bureau" class="hud-val">—</span>
      </div>
    </div>
  </header>

  <!-- 主视口 -->
  <main>
    <div id="drop-zone">拖入 .mid / .midi 音乐文件，或 .mp3 / .wav / .m4a 音频即可自动转谱演奏</div>
    <div id="center-play-btn" class="center-play-overlay">▶ 播放致爱丽丝 (Für Elise 双手手势纠缠版)</div>
    <canvas id="spiral-canvas"></canvas>

    <!-- 视角辅助按钮 -->
    <div class="view-controls">
      <button id="btn-zoom-in" class="btn-icon" title="放大 (支持滚轮)">+</button>
      <button id="btn-zoom-out" class="btn-icon" title="缩小 (支持滚轮)">−</button>
      <button id="btn-reset-view" class="btn-icon" title="复位中心 (双击画布)">⟲</button>
    </div>
  </main>

  <!-- 底部多功能播放栏 -->
  <footer>
    <div class="progress-row">
      <input type="range" id="progress-bar" min="0" max="1000" value="0">
      <span id="time-display">00:00 / 00:00</span>
    </div>

    <div class="controls-row">
      <div class="ctrl-group">
        <button id="btn-play" class="btn-ctrl">▶ 播放</button>
        <button id="btn-stop" class="btn-ctrl">⏹ 停止</button>

        <select id="sample-select" class="ctrl-select">
          <optgroup label="🎸 西班牙古典吉他 · 《爱的罗曼史》对偶几何">
            <option value="samples/guitar_romance_anonimo.mid">🎸 西班牙民谣 · 《爱的罗曼史》(Romance d'Amour · E小调与E大调对偶轮指)</option>
          </optgroup>

          <optgroup label="🎻 萨拉萨蒂 · 《流浪者之歌》(吉普赛小提琴炫技神作)">
            <option value="samples/sarasate_zigeunerweisen_fast.mid">🎻 萨拉萨蒂 · 《流浪者之歌·极速查尔达什快板》(Allegro Vivace · 小提琴跳弓炫技烟花)</option>
            <option value="samples/sarasate_zigeunerweisen_full.mid">🎻 萨拉萨蒂 · 《流浪者之歌全曲》(小提琴与大钢琴伴奏 · 完整7分钟全本)</option>
          </optgroup>

          <optgroup label="🦓 圣-桑 · 《动物狂欢节》双钢琴速度神迹">
            <option value="samples/saintsaens_carnival_hemiones_2pianos.mid">🦓 圣-桑 · 《野驴》(Hémiones · 双钢琴全速狂奔 · 33秒极速对数涡旋)</option>
          </optgroup>

          <optgroup label="💣 柴可夫斯基 · 《1812序曲》宏大交响与炮火几何">
            <option value="samples/tchaikovsky_1812_finale.mid">💣 柴可夫斯基 · 《1812序曲终章》(加农炮火与全城钟鸣 · 终极高能)</option>
            <option value="samples/tchaikovsky_1812_piano.mid">🎹 柴可夫斯基 · 《1812序曲》(大钢琴激奏独奏版 · 3分钟精粹)</option>
            <option value="samples/tchaikovsky_1812_orchestra_full.mid">💥 柴可夫斯基 · 《1812序曲全曲》(交响全景版 · 30轨管弦全本)</option>
          </optgroup>

          <optgroup label="👐 双手完整演奏 · 左手(紫)与右手(青)手势连线网">
            <option value="samples/den_pobedy_victory_day.mid" selected>🎖️ 胜利勋章 · 卫国史诗《胜利之日》(День Победы / Den Pobedy · 咪拉西哆哆哆哆来)</option>
            <option value="samples/steel_torrent_march.mid">🛡️ 铁血战阵 · 李旭昊《钢铁洪流进行曲》(March of the Steel Torrent · 重装履带与战旗号角)</option>
            <option value="samples/hongqisong.mid">🇨🇳 世纪史诗 · 吕其明《红旗颂》(Ode to the Red Flag · 号角引子与深情大提琴主题)</option>
            <option value="samples/communism_theme_cello.mid">🚩 崇高颂歌 · 共产主义主题曲《牢不可破的联盟》(Communism Theme · 大提琴深沉复调)</option>
            <option value="samples/beethoven_moonlight_full.mid" selected>👐 贝多芬 · 《月光奏鸣曲第一乐章》(双手完整版 · 双手手势纠缠)</option>
            <option value="samples/shostakovich_waltz_2.mid">🎷 时代的华尔兹 · 肖斯塔科维奇《第二圆舞曲》(Waltz No. 2 · 管弦乐总谱)</option>
            <option value="samples/beethoven_pathetique_1_full.mid">⚡ 贝多芬 · 《悲怆奏鸣曲第一乐章》(Op.13 命运巨锤庄板与狂暴快板 · 双手完整版)</option>
            <option value="samples/beethoven_pathetique_2_full.mid">🌹 贝多芬 · 《悲怆奏鸣曲第二乐章》(Op.13 如歌柔板 · 双手完整版)</option>
            <option value="samples/beethoven_pathetique_3_full.mid">🌪️ 贝多芬 · 《悲怆奏鸣曲第三乐章》(Op.13 疾风回旋曲 · 双手完整版)</option>
            <option value="samples/liszt_campanella_full.mid">🔔 李斯特 · 《钟》(La Campanella · 帕格尼尼大练习曲第三首 · 双手完整版)</option>
            <option value="samples/liszt_liebestraum_full.mid">💖 李斯特 · 《爱之梦第三首》(Liebestraum No.3 · 双手完整版)</option>
            <option value="samples/liszt_hungarian_rhap2_full.mid">🇭🇺 李斯特 · 《匈牙利狂想曲第二号》(Hungarian Rhapsody No.2 · 双手完整版)</option>
            <option value="samples/beethoven_elise_full.mid">👐 贝多芬 · 《致爱丽丝》(双手完整版 · 双手手势纠缠)</option>
            <option value="samples/mozart_turca_master_full.mid">👐 莫扎特 · 《土耳其进行曲大师版》(双手完整版 · 双手手势纠缠)</option>
            <option value="samples/debussy_clair_de_lune_full.mid">👐 德彪西 · 《月光》(双手完整版 · 双手手势纠缠)</option>
            <option value="samples/chopin_fantaisie_full.mid">👐 肖邦 · 《幻想即兴曲》(双手完整版 · 双手手势纠缠)</option>
            <option value="samples/chopin_raindrop_full.mid">👐 肖邦 · 《雨滴前奏曲》(双手完整版 · 双手手势纠缠)</option>
            <option value="samples/chopin_nocturne_op9_1_full.mid">🌙 肖邦 · 《降B小调第一夜曲》(Op.9 No.1 · 鲁宾斯坦金奖同款 · 双手完整版)</option>
            <option value="samples/yellow_river_defend_full.mid">🌊 冼星海/殷承宗 · 《黄河钢琴协奏曲第四乐章·保卫黄河》(三部复调大轮唱卡农 · 双手完整版)</option>
          </optgroup>

          <option value="samples/bach_crab_canon.mid">🦀 极境 · 巴赫《音乐的奉献》莫比乌斯螃蟹卡农 (BWV 1079 Crab Canon)</option>
          <option value="samples/mozart_turca_major_triads_30s.mid">⚡ 阴阳和合 · 莫扎特《土耳其进行曲》大三和弦双声部 (Turca Major Triad)</option>
          <option value="samples/mozart_turca_raw_30s.mid">🎹 原型对照 · 莫扎特《土耳其进行曲》裸单音轨 (Turca Raw Melody)</option>
          <option value="samples/orbital_major_triads_30s.mid">⚡ 丑位金鸣 · 30°角根音大三和弦双声部 (30° Major Triad & Bass Leap)</option>
          <option value="samples/orbital_major_triads_0deg.mid">🌟 子位初萌 · 0°角根音大三和弦双声部 (0° Major Triad & Bass Leap)</option>
          <option value="samples/silent_night_lagrange_resonance.mid">📐 拉格朗日共振 · 30°-60°-90°三位一体直角三角赋格 (Lagrange Resonance)</option>
          <option value="samples/silent_night_mirror_counterpoint.mid">🪞 倒影赋格 · 天地纯镜面反射《镜中平安夜》(Silent Night Mirror Counterpoint)</option>
          <option value="samples/silent_night_spiral_conic_60deg.mid">🌌 卯酉地平 · 60度圆锥截面《星际平安夜》(Silent Night Spiral Conic)</option>
          <option value="samples/orbital_precession_30s.mid">🌟 极相之舞 · 30秒对数进动单音轨 (Orbital Precession)</option>
          <option value="samples/canon_in_d.mid">名曲 · 帕赫贝尔《卡农》(Canon in D)</option>
          <option value="samples/bach_prelude.mid">经典 · 巴赫 C 大调前奏曲 (BWV 846)</option>
          <option value="samples/sanheju_triads.mid">乐律 · 四大三合局增三和弦轮转</option>
          <option value="samples/pentatonic_moonlight.mid">典雅 · 东方五声彩云追月</option>

          <optgroup label="🎼 经典名曲 · 纯右手裸旋律 (Left Hand Stripped)">
            <option value="samples/beethoven_elise_right.mid">🎼 贝多芬 · 《致爱丽丝》(Für Elise - 右手纯旋律)</option>
            <option value="samples/beethoven_moonlight_right.mid">🎼 贝多芬 · 《月光奏鸣曲第一乐章》(Moonlight - 右手纯旋律)</option>
            <option value="samples/beethoven_pathetique_1_right.mid">⚡ 贝多芬 · 《悲怆第一乐章》(Op.13 Grave - 右手暴风雨纯旋律)</option>
            <option value="samples/beethoven_pathetique_2_right.mid">🌹 贝多芬 · 《悲怆第二乐章如歌柔板》(Pathetique - 右手纯旋律)</option>
            <option value="samples/beethoven_pathetique_3_right.mid">🌪️ 贝多芬 · 《悲怆第三乐章》(Op.13 Rondo - 右手回旋纯旋律)</option>
            <option value="samples/mozart_turca_master_right.mid">🎼 莫扎特 · 《土耳其进行曲大师版》(Rondo alla Turca - 右手纯旋律)</option>
            <option value="samples/mozart_k545_1_right.mid">🎼 莫扎特 · 《C大调简易奏鸣曲第一乐章》(K.545 - 右手纯旋律)</option>
            <option value="samples/chopin_valse_op18_right.mid">🎼 肖邦 · 《华丽大圆舞曲》(Grande Valse Op.18 - 右手纯旋律)</option>
            <option value="samples/chopin_raindrop_right.mid">🎼 肖邦 · 《雨滴前奏曲》(Raindrop Prelude - 右手纯旋律)</option>
            <option value="samples/chopin_fantaisie_right.mid">🎼 肖邦 · 《幻想即兴曲》(Fantaisie-Impromptu - 右手纯旋律)</option>
            <option value="samples/chopin_nocturne_op9_1_right.mid">🌙 肖邦 · 《降B小调第一夜曲》(Op.9 No.1 · 右手歌唱纯旋律)</option>
            <option value="samples/yellow_river_defend_right.mid">🌊 冼星海/殷承宗 · 《保卫黄河》(第四乐章 · 右手刚劲纯旋律)</option>
            <option value="samples/bach_prelude_846_right.mid">🎼 巴赫 · 《C大调前奏曲》(BWV 846 - 右手纯旋律)</option>
            <option value="samples/bach_fugue_847_right.mid">🎼 巴赫 · 《C小调赋格》(BWV 847 - 高音声部)</option>
            <option value="samples/debussy_clair_de_lune_right.mid">🎼 德彪西 · 《月光》(Clair de Lune - 右手纯旋律)</option>
            <option value="samples/liszt_campanella_right.mid">🔔 李斯特 · 《钟》(La Campanella - 右手极速钟鸣旋律)</option>
            <option value="samples/liszt_liebestraum_right.mid">💖 李斯特 · 《爱之梦第三首》(Liebestraum No.3 - 右手纯旋律)</option>
            <option value="samples/liszt_hungarian_rhap2_right.mid">🇭🇺 李斯特 · 《匈牙利狂想曲第二号》(Hungarian Rhapsody No.2 - 右手纯旋律)</option>
          </optgroup>
        </select>

        <input type="file" id="file-input" accept=".mid,.midi,.mp3,.wav,.ogg,.m4a" style="display: none;">
        <button id="btn-upload" class="btn-ctrl">📁 打开 MIDI / 音频转谱</button>
        <button id="btn-mic" class="btn-ctrl" title="开启麦克风实时原声绝对音感识别">🎙️ 实时麦克风</button>
        <select id="timbre-select" class="ctrl-select" title="音色选择">
          <option value="steinway" selected>🎹 施坦威音乐厅九尺大钢琴 (3D声相 + 金色大厅混响)</option>
          <option value="reaper">🎹 REAPER 外部物理建模 (Pianoteq 9 硬件直通)</option>
          <option value="synth">🌌 对数星音合成器 (Space Synth)</option>
        </select>
        <button id="btn-bridge" class="btn-ctrl" style="border-color:#38bdf8;" title="Mac Mini REAPER 联锁状态">🎹 REAPER 联锁: 联通 ✅</button>
      </div>

      <div class="ctrl-group">
        <div class="speed-control">
          <span>倍速</span>
          <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
          <span id="speed-label">1.0x</span>
        </div>

        <div class="legend-bar">
          <span><span class="dot" style="background:#38bdf8;"></span>申子辰(水)</span>
          <span><span class="dot" style="background:#34d399;"></span>亥卯未(木)</span>
          <span><span class="dot" style="background:#f87171;"></span>寅午戌(火)</span>
          <span><span class="dot" style="background:#fbbf24;"></span>巳酉丑(金)</span>
        </div>
      </div>
    </div>
  </footer>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
